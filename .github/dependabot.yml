# Dependabot keeps the Python dependencies in requirements.txt up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch routine minor and patch bumps into one pull request; major
      # version bumps still arrive separately so they can be reviewed on
      # their own.
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
