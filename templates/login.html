{% extends "base.html" %}

{% block title %}Login - Blood Donation Camp{% endblock %}

{% block content %}
<div class="narrow">
    <div class="card">
        <h1 class="text-center">Login</h1>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username"
                       value="{{ username|default:'' }}" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn--block">Login</button>
        </form>

        <p class="text-center muted" style="margin-top:20px">
            Not registered yet? <a href="{% url 'register' %}">Create an account</a>.
        </p>
    </div>
</div>
{% endblock %}
